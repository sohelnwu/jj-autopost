# JJ Network অটো পোস্ট
# "কর্মী" রান: একটানা ~৫ ঘণ্টা ৪০ মিনিট চলে, প্রতি ৫ মিনিটে দেখে কোন পোস্টের সময় হয়েছে,
# শেষে নিজেই পরের রান চালু করে — এভাবে ২৪ ঘণ্টা চলে।
# GitHub-এর ঘণ্টাভিত্তিক শিডিউল শুধু ব্যাকআপ: কর্মী কোনো কারণে থেমে গেলে আবার চালু করে।

name: JJ AutoPost

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'worker = সারাক্ষণ চলা কর্মী (সাধারণত নিজে থেকেই চলে) — হাতে পরীক্ষার জন্য খালি রাখুন'
        type: choice
        default: ''
        options: ['', 'worker']
      page:
        description: 'কোন পেজ? (config-এর id, যেমন jj-news — সব পেজের জন্য all)'
        default: 'all'
        required: true
      type:
        description: 'কোন কার্ড? (খালি রাখলে সব)'
        type: choice
        default: ''
        options: ['', 'check-tokens', 'breaking-auto', 'good-night', 'good-morning', 'weather', 'prayer', 'news-list', 'single-news', 'reel-news', 'reel-breaking', 'reel-weather-prayer', 'reel-morning', 'reel-lines']
      dry_run:
        description: 'শুধু কার্ড বানাবে, ফেসবুকে পোস্ট করবে না'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  # কর্মী একসাথে একটাই চলে; হাতে চালানো পরীক্ষা আলাদা চলে
  group: ${{ (github.event_name == 'schedule' || inputs.mode == 'worker') && 'jj-worker' || github.run_id }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      FB_PAGE_TOKENS: ${{ secrets.FB_PAGE_TOKENS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IS_WORKER: ${{ (github.event_name == 'schedule' || inputs.mode == 'worker') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: প্যাকেজ ও ব্রাউজার ইনস্টল
        run: |
          npm ci
          if [ "${{ inputs.type }}" = "check-tokens" ]; then exit 0; fi
          npx playwright install --with-deps chromium
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install --quiet --user --break-system-packages edge-tts || pipx install edge-tts || echo "edge-tts ইনস্টল হয়নি — রিল ভয়েস ছাড়া হবে"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config user.name "jj-autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: সারাক্ষণ চলা কর্মী (প্রতি ৫ মিনিটে পোস্টের সময় দেখে)
        if: env.IS_WORKER == 'true'
        run: node src/worker.js

      - name: কার্ড বানানো (হাতে চালানো)
        if: env.IS_WORKER != 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PAGE: ${{ inputs.page }}
          TYPE: ${{ inputs.type }}
        run: |
          if [ -n "$TYPE" ]; then node src/run.js --page "$PAGE" --type "$TYPE"; else node src/run.js --page "$PAGE"; fi

      - name: বানানো কার্ডগুলো সংরক্ষণ (Artifacts থেকে ডাউনলোড করা যাবে)
        if: always() && env.IS_WORKER != 'true' && (hashFiles('out/*/*.png') != '' || hashFiles('out/*/*.mp4') != '')
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ github.run_id }}
          path: |
            out/*/*.png
            out/*/*.mp4
          retention-days: 3

      - name: কোনগুলো পোস্ট হয়েছে তা মনে রাখা
        if: always()
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git add state
            git commit -m "পোস্টের হিসাব আপডেট [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
